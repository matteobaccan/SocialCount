name: Release

# Builds the cross-platform binaries and publishes a GitHub release.
#
# Two ways to start it:
#   1. Run it manually (Actions > Release > Run workflow) on the main branch,
#      leaving "tag" empty: the tag vX.Y.Z is created from the version in
#      Cargo.toml and the release is published.
#   2. Push a version tag yourself, e.g.:
#        git tag -a v0.1.0 -m "Release v0.1.0" && git push origin v0.1.0
#
# Running it manually with an existing tag rebuilds and republishes that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0 (empty = v + version in Cargo.toml, created if missing)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve, verify and create the tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cargo_version() {
            grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/'
          }

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(cargo_version)"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag '$TAG' (expected vX.Y.Z)"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            tag_exists=true
            git fetch --depth 1 origin "refs/tags/$TAG"
            git checkout -q FETCH_HEAD
          else
            tag_exists=false
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Tag $TAG does not exist yet: run the workflow on $DEFAULT_BRANCH to create it"
              exit 1
            fi
          fi

          version=$(cargo_version)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version in Cargo.toml (v$version)"
            exit 1
          fi

          if [ "$tag_exists" = "false" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created tag $TAG at $(git rev-parse --short HEAD)"
          else
            echo "Using existing tag $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            exe: socialcount.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            exe: socialcount
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            exe: socialcount
          - os: macos-15
            target: x86_64-apple-darwin
            name: macos-x64
            exe: socialcount
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux dependencies (X11/Wayland/OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "socialcount-${{ matrix.name }}-$env:TAG"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.exe }} $dir/
          Copy-Item channels.toml, README.md, LICENSE $dir/
          # Archive the directory contents directly so extracting creates a clean folder
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip" -Force
          "ARCHIVE=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          dir="socialcount-${{ matrix.name }}-$TAG"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} "$dir/"
          chmod +x "$dir/${{ matrix.exe }}"
          cp channels.toml README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  publish:
    needs: [prepare, build]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: SocialCount ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `socialcount-windows-x64-${{ env.TAG }}.zip` |
            | Linux (x64) | `socialcount-linux-x64-${{ env.TAG }}.tar.gz` |
            | macOS Apple Silicon (M1/M2/M3…) | `socialcount-macos-arm64-${{ env.TAG }}.tar.gz` |
            | macOS Intel | `socialcount-macos-x64-${{ env.TAG }}.tar.gz` |

            > macOS: the binary is unsigned. On first run, right-click → Open,
            > or run `xattr -d com.apple.quarantine ./socialcount`.
