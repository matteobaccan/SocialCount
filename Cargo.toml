[package]
name = "socialcount"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
open = "5.3"
