[package]
name = "socialcount"
version = "1.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }
image = { version = "0.25", features = ["png", "jpeg", "webp", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
open = "5.3"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
ab_glyph = "0.2"
